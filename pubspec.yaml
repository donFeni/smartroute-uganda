name: smartroute_uganda
description: "SmartRoute Uganda — Beyond Navigation. Towards Smarter Mobility."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.8.1

  # Local storage (platform-safe, works on Android + Web)
  shared_preferences: ^2.3.3

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # HTTP
  http: ^1.2.2

  # URL launcher
  url_launcher: ^6.3.1

  # Shimmer loading skeleton
  shimmer: ^3.0.0

  # Date/number formatting
  intl: ^0.19.0

  # UUID generation
  uuid: ^4.5.1

  # Value equality
  equatable: ^2.0.7

  # Google Fonts (Space Grotesk, Inter, JetBrains Mono) — cached locally after first load
  google_fonts: ^8.2.1
  geolocator: ^14.1.2
  flutter_animate: ^4.5.2
  lottie: ^3.8.2
  rive: ^0.14.11
  animations: ^2.2.0
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/images/
    - assets/icons/

# ─── flutter_native_splash ────────────────────────────────────────────────────
flutter_native_splash:
  # Obsidian background — exact brand colour
  color: "#090E18"
  color_dark: "#090E18"

  # SmartRoute symbol — preserved as-is from assets/brand/
  image: assets/brand/smartroute_original.png.png
  image_dark: assets/brand/smartroute_original.png.png

  # Android 12+ adaptive icon
  android_12:
    image: assets/brand/smartroute_original.png.png
    icon_background_color: "#090E18"

  # Keep the native splash visible until Flutter removes it explicitly.
  fullscreen: true

